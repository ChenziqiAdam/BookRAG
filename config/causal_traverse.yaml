# CausalTraverse config — tree-only RAG with causal gate on document tree
# Analogous to HugRAG but applied only to tree traversal (no KG required)

pdf_path: /mnt/data/ziqi/BookRAG/BOOKRAG_VLDB_2026_full.pdf
save_path: ./outputs/causal_traverse

llm:
  model_name: Qwen/Qwen3-8B-AWQ
  api_key: openai
  api_base: http://localhost:8003/v1
  backend: openai
  max_tokens: 5000
  temperature: 0.1
  frequency_penalty: 0.0
  presence_penalty: 0.0
  max_workers: 8

vlm:
  model_name: Qwen2-5-VL
  api_key: openai
  api_base: http://localhost:8000/v1
  temperature: 0.1
  max_tokens: 6000
  backend: gpt

index:
  chunk_size: 512
  overlap: 50

mineru:
  backend: vlm-sglang-client
  method: vlm
  server_url: http://127.0.0.1:30001
  lang: en

tree:
  node_keywords: True
  node_summary: True
  causal_gate: true   # Build causal gate edges during index construction

rag_force_reprocess: True

rag:
  strategy: causal_traverse
  max_depth: -1
  gate_boost: 2.0
  beam_width: 1
  use_planning: true
  entity_seed_topk: 3
  reranker_topk: 5
  reranker_config:
    model_name: bge-reranker-v2-m3
    max_length: 4096
    device: "cuda:2"
    backend: vllm
    api_base: "http://localhost:9998/v1"
  embedding_config:
    model_name: text-embedding-ada-002
    backend: openai
    max_length: 4096
    device: "cuda:2"
    api_base: "http://localhost:9999/v1"
